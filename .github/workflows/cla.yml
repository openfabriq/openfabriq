name: CLA

# A contributor agrees to CLA.md by ticking its box in the pull request's description; the pull request keeps the record.
# The description is only matched, never run, and no code of the pull request is checked out.
# pull_request_target runs this file from main, without waiting for a maintainer to approve a first-time contributor's
# workflows, so they see the missing box at once. Safe only while the job checks out nothing and has no permissions.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Maintainers and bots have nothing to sign.
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    steps:
      - name: The box of the Contributor License Agreement is ticked
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qiE '^[[:space:]]*- \[x\] I agree to the \[Contributor License Agreement\]'; then exit 0; fi
          echo "::error::Tick \"I agree to the Contributor License Agreement\" in the pull request's description (CLA.md)."
          exit 1
